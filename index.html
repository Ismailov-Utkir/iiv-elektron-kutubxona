<style>

  :root{
    --bg:#eef2f8; --surface:#ffffff; --surface-2:#e9eff7;
    --primary:#1f5f9e; --primary-deep:#123f6e; --primary-tint:#e4eef8; --primary-tint2:#cee0f1;
    --slate:#5d7590; --slate-tint:#e7edf4;
    --ink:#152338; --muted:#5f6f84; --muted-2:#8a99ad; --line:#d8e2ee;
    --ok:#2f8f5b; --ok-tint:#e3f2e9; --alert:#c0473d; --alert-tint:#f7e4e1;
    --shadow:0 1px 2px rgba(18,35,60,.05), 0 8px 24px rgba(18,35,60,.07);
    --shadow-sm:0 1px 2px rgba(18,35,60,.06);
    --radius:16px; --radius-sm:11px;
    --font:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  p{margin:0}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--primary-tint)}
  svg{flex-shrink:0}
  svg:not([width]){width:16px;height:16px}

  .app{display:flex;min-height:100vh}
  .sidebar{width:256px;flex-shrink:0;background:linear-gradient(180deg,var(--primary-deep),#0d3358);color:#d6e4f5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 16px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
  .brand-mark{width:42px;height:42px;flex-shrink:0;color:#bcd3ee}
  .brand-name{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.15}
  .brand-sub{font-size:11px;color:#96c4bb;margin-top:2px;font-weight:500}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .nav-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7fb3aa;margin:14px 12px 6px;font-weight:700}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:#cfe7e1;font-size:14px;font-weight:600;border:none;background:none;text-align:left;width:100%;transition:background .15s,color .15s}
  .nav-item svg{width:19px;height:19px;opacity:.85}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav-item.active{background:rgba(255,255,255,.13);color:#fff}
  .nav-item.active svg{opacity:1;color:#fff}
  .nav-item .n-badge{margin-left:auto;background:var(--primary-tint);color:var(--primary-deep);font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px}
  .side-foot{margin-top:auto;padding:14px 12px 2px;border-top:1px solid rgba(255,255,255,.1)}
  .side-foot .mh{font-size:13px;font-weight:700;color:#fff}
  .side-foot .tm{font-size:11.5px;color:#8fbdb4;margin-top:2px}
  .side-role{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,.1);color:#d6e4f5;font-size:11px;font-weight:700;letter-spacing:.03em;padding:5px 10px;border-radius:20px}
  .side-role svg{width:13px;height:13px}
  .reset-link{display:block;margin-top:12px;background:none;border:none;color:#8fbdb4;font-size:11.5px;font-weight:600;text-decoration:underline;padding:2px 0;text-align:left}
  .reset-link:hover{color:#cfe7e1}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}

  .sec-title{font-size:17px;font-weight:800;margin-bottom:2px}

  .btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:700;border:1px solid transparent;transition:.15s;white-space:nowrap}
  .btn svg{width:16px;height:16px}

  .btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}

  .btn-sm{padding:8px 13px;font-size:12.5px}
  .btn-xs{padding:6px 10px;font-size:11.5px;border-radius:9px}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}

  .job-status svg{width:16px;height:16px}
  .badge.ok{background:var(--ok-tint);color:var(--ok)} .badge.teal{background:var(--primary-tint);color:var(--primary-deep)}

  .badge.grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

  .bar{height:8px;border-radius:20px;background:var(--surface-2);overflow:hidden}

  .pill-tabs{display:inline-flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--line);flex-wrap:wrap}
  .pill-tabs button{border:none;background:none;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);transition:.15s}
  .pill-tabs button.on{background:var(--surface);color:var(--primary-deep);box-shadow:var(--shadow-sm)}

  .hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(120deg,var(--primary-deep) 0%,#1a4f88 55%,#1f5f9e 100%);color:#fff;padding:30px 32px;margin-bottom:24px}

  .pillars{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:24px}

  .stat .st-tr{font-size:11.5px;font-weight:700;margin-top:9px;display:inline-flex;align-items:center;gap:4px}

  .ring{position:relative;flex-shrink:0}

  .rowlist{display:flex;flex-direction:column}

  .comp-ico svg{width:17px;height:17px;color:var(--muted)}

  .fam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

  .auth-back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:18px;padding:0}

  .auth-foot{text-align:center;margin-top:26px;color:var(--muted-2);font-size:11.5px}

  /* Admin */
  .rtable{width:100%;border-collapse:collapse;font-size:13.5px}
  .rtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
  .rtable th.num,.rtable td.num{text-align:right}
  .rtable td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .rtable tr:last-child td{border-bottom:none}
  .rtable tr:hover td{background:var(--surface-2)}
  .rtable .rn{font-weight:700}
  .rtable .minibar{height:6px;border-radius:20px;background:var(--surface-2);overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
  .rtable .minibar > i{display:block;height:100%;background:var(--primary)}
  .mah-search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:360px}
  .mah-search svg{width:17px;height:17px;color:var(--muted)}
  .mah-search input{border:none;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .mah-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .mah-card{padding:16px 18px;transition:.16s;cursor:pointer;display:flex;flex-direction:column;gap:10px}
  .mah-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
  .mah-card .mc-top{display:flex;align-items:center;gap:11px}
  .mah-card .mc-ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;background:var(--primary-tint);color:var(--primary-deep);display:flex;align-items:center;justify-content:center}
  .mah-card .mc-ic svg{width:19px;height:19px}
  .mah-card .mc-n{font-weight:800;font-size:14.5px;line-height:1.2}
  .mah-card .mc-r{font-size:12px;color:var(--muted);margin-top:2px}
  .mah-card .mc-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
  .mah-card .mc-open{display:inline-flex;align-items:center;gap:5px;color:var(--primary);font-weight:700;font-size:12.5px}
  .mah-card .mc-open svg{width:14px;height:14px}

  /* Sertifikat */
  #printArea{display:none}
  .cert{background:#ffffff;border:2px solid var(--primary);border-radius:6px;padding:34px 40px;text-align:center;position:relative;font-family:var(--font)}
  .cert::before{content:"";position:absolute;inset:8px;border:1px solid #a9d0c7;border-radius:4px;pointer-events:none}
  .cert-corner{position:absolute;width:32px;height:32px;color:var(--primary);opacity:.8}
  .cert-corner.tl{top:14px;left:14px} .cert-corner.tr{top:14px;right:14px;transform:rotate(90deg)}
  .cert-corner.bl{bottom:14px;left:14px;transform:rotate(-90deg)} .cert-corner.br{bottom:14px;right:14px;transform:rotate(180deg)}
  .cert-org{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .cert-h{font-size:29px;font-weight:800;color:var(--primary-deep);letter-spacing:.14em;margin:14px 0 4px}
  .cert-line{width:60px;height:3px;background:var(--primary);margin:6px auto 18px;border-radius:2px}
  .cert-sub{font-size:13px;color:var(--muted)}
  .cert-name{font-size:25px;font-weight:800;color:var(--ink);margin:10px 0;padding-bottom:8px;border-bottom:1.5px dashed #a9d0c7;display:inline-block;min-width:60%}
  .cert-reason{font-size:14px;color:var(--ink);line-height:1.5;max-width:410px;margin:14px auto 0}
  .cert-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:32px;font-size:12px;color:var(--muted)}
  .cert-sign{text-align:center}
  .cert-sign .sl{width:150px;border-top:1px solid var(--ink);margin-bottom:5px}
  .cert-seal{width:62px;height:62px;border-radius:50%;border:2px solid var(--primary);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;text-align:center;line-height:1.2;transform:rotate(-12deg)}

  @media print{
    body{background:#fff}
    body > *{visibility:hidden}
    #printArea, #printArea *{visibility:visible}
    #printArea{display:block!important;position:fixed;inset:0;padding:24px}
    .cert{box-shadow:none}
  }

  @media(max-width:940px){

    .sidebar{width:100%;height:auto;position:static;flex-direction:column;padding:16px}

    .pillars{grid-template-columns:repeat(2,1fr)}

    .fam-grid,.nam-grid,.mah-grid{grid-template-columns:1fr}

    .cert{padding:24px}

  }
  @media(max-width:560px){

  /* Orqa fon naqshi (yulduzli girih) */
  #appBg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.12;background-repeat:repeat;background-size:360px auto}
  .app,.auth-wrap{position:relative;z-index:1}
  .sidebar{z-index:2}

  /* Kategoriya ranglari (yangi) */
  .c-volontyor{background:var(--ok-tint);color:var(--ok)}
  .c-kitobxon{background:var(--slate-tint);color:var(--slate)}

  /* Murojaatlar */
  .mur-card{padding:16px 18px;margin-bottom:12px;border-left:4px solid var(--primary)}
  .mur-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
  .mur-title{font-weight:800;font-size:15px}

  .st-new{background:#e6efe9;color:#3a6f5e} .st-proc{background:#eef2e0;color:#7a7a2e} 
  .badge.new{background:#e2ecf7;color:#2f5fa0} .badge.proc{background:#f6efdc;color:#8a6d1e} .badge.done{background:var(--ok-tint);color:var(--ok)} .badge.rej{background:var(--alert-tint);color:var(--alert)}

  /* Ish takliflari */

  /* Kitoblar */

  /* Statistika grafiklari */
  .chart-card{padding:20px 22px}

  .risk-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .risk-lbl{width:130px;font-size:13px;font-weight:700;flex-shrink:0}
  .risk-track{flex:1;background:var(--surface-2);border-radius:20px;height:14px;overflow:hidden}
  .risk-fill{height:100%;border-radius:20px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
  .risk-val{width:42px;text-align:right;font-weight:800;font-size:14px;flex-shrink:0}

  /* Interaktiv O'zbekiston xaritasi */
  .uzmap{position:relative;width:100%;max-width:880px;margin:0 auto;background:#ffffff;border:1px solid var(--line);border-radius:16px;padding:8px 10px}
  .uzt{display:none;position:absolute;z-index:20;pointer-events:none;background:#08343b;color:#fff;border-radius:10px;padding:9px 13px;box-shadow:0 6px 22px rgba(8,52,59,.28);max-width:260px}
  .uzt b{display:block;font-size:13.5px;font-weight:800;line-height:1.25}
  .uzt span{display:block;font-size:11.5px;color:#9fc9cf;margin-top:3px;line-height:1.3}
  .uzmap svg{width:100%;height:auto;max-height:clamp(260px,52vh,500px);display:block}
  .uzr{stroke:#fff;stroke-width:1.1;cursor:pointer;transition:fill .15s ease,filter .15s ease,stroke-width .15s ease;stroke-linejoin:round}
  .uzr:hover{filter:brightness(1.09) saturate(1.12);stroke:#00545f;stroke-width:1.8}
  .uzr.on{stroke:#00323a;stroke-width:2.4;filter:brightness(1.12)}
  .crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
  .crumb button{background:none;border:0;padding:4px 8px;border-radius:8px;cursor:pointer;font:inherit;font-weight:700;color:var(--primary);display:inline-flex;align-items:center;gap:6px}

  .rtable tr.ttot td{font-weight:800;border-top:2px solid var(--slate);background:var(--primary-tint);color:var(--primary-deep);cursor:default}

  /* Murojaatlar jadvali */

  .book-tr{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .tr-chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

  .book-sec{font-size:14.5px;font-weight:800;color:var(--primary-deep);margin:24px 0 14px;padding-bottom:9px;border-bottom:2px solid var(--primary-tint2);display:flex;align-items:center;gap:9px}
  .book-sec svg{width:17px;height:17px;color:var(--primary);flex-shrink:0}
/* ===== IIV e-kutubxona qo'shimchalari ===== */
.nav-item svg{width:18px;height:18px}
.brand-mark{width:46px;height:46px;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.brand-sub{color:#bcd3ee}
.nav-lbl{color:#8fb0d6}
.nav-item{color:#d6e4f5}
.side-foot .tm,.reset-link{color:#a9c4e4}
.auth-brand .bm{width:64px;height:64px}
.auth-brand .bn{font-size:26px}
.tdate{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.tdate svg{width:15px;height:15px;color:var(--primary)}
.st-ico svg{width:19px;height:19px}
.fico svg,.comp-ico svg{width:17px;height:17px}
.comp-ico svg{color:var(--primary)}
.badge svg{width:12px;height:12px}
.c-tadbir{background:var(--ok-tint);color:var(--ok)}
.c-hashar{background:var(--primary-tint);color:var(--primary-deep)}
/* mini muqova */
.bk-cov.gen{position:relative;flex-direction:column;justify-content:space-between;align-items:center;padding:10px 7px 8px;border:0;border-radius:3px 7px 7px 3px;box-shadow:inset 5px 0 8px -5px rgba(0,0,0,.5),0 6px 14px rgba(18,35,60,.22);text-align:center;color:#f4e6c3;overflow:hidden}
.bk-cov.gen::after{content:"";position:absolute;inset:5px;border:1px solid rgba(216,180,106,.5);border-radius:2px 5px 5px 2px;pointer-events:none}
.bk-cov.gen .ga{letter-spacing:.06em;text-transform:uppercase;opacity:.85;line-height:1.2;position:relative;z-index:1;max-height:2.5em;overflow:hidden}
.bk-cov.gen .gt{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.18;position:relative;z-index:1;background:linear-gradient(180deg,#f7e7bd,#d8b46a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.bk-cov.gen .gm{font-size:7px;letter-spacing:.2em;opacity:.6;position:relative;z-index:1}
.bk-cov.real{border-radius:3px 7px 7px 3px;box-shadow:0 6px 14px rgba(18,35,60,.22)}
.bk-cov.real img{object-fit:cover}
.row .bk-cov{flex-shrink:0}
.row .bk-cov.gen .ga,.row .bk-cov.gen .gm,.mtable .bk-cov.gen .ga,.mtable .bk-cov.gen .gm{display:none}
.row .bk-cov.gen .gt,.mtable .bk-cov.gen .gt{font-size:5px!important;margin:auto 0}
/* oy kitobi bloki */
.mbox{display:grid;grid-template-columns:auto 1fr 300px;gap:0;overflow:hidden}
.mb-l{background:linear-gradient(160deg,var(--primary-tint),var(--primary-tint2));display:grid;place-items:center;padding:24px 30px}
.mb-c{padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.mb-t{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.mb-ann{font-size:13.5px;line-height:1.55;margin:6px 0 12px;color:var(--ink)}
.mb-r{padding:22px 22px;border-left:1px solid var(--line);background:var(--surface)}
.days{display:flex;gap:2px;margin-top:6px}
.days i{flex:1;height:8px;border-radius:2px;background:var(--surface-2)}
.days i.p{background:var(--primary-tint2)}.days i.t{background:var(--primary)}
.days-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px;font-weight:600}
/* o'quvchi oyna */
.reader{width:min(1180px,100%);height:min(94vh,1200px);background:var(--surface);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.rd-head{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rd-head b{display:block;font-size:16px;font-weight:800}.rd-head span{display:block;font-size:12.5px;color:var(--muted)}
.rd-act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rd-act a{text-decoration:none}
.pg-in{display:flex;align-items:center;gap:7px;background:var(--primary-tint);border-radius:10px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:700;color:var(--primary-deep)}
.pg-in input{width:64px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:700 13px var(--font)}
.pdf-frame{flex:1;border:0;width:100%;background:#525659}
/* test */
.tstcard{max-width:900px}
.timer{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--primary-deep);background:var(--primary-tint);padding:8px 14px;border-radius:11px;font-variant-numeric:tabular-nums}
.timer svg{width:17px;height:17px}.timer.low{background:var(--alert-tint);color:var(--alert)}
.q-t{font-size:21px;font-weight:800;margin:8px 0 18px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font:600 15px var(--font);color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--primary);background:var(--primary-tint)}
.opt .l{width:32px;height:32px;border-radius:9px;background:var(--surface-2);color:var(--primary-deep);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--primary-tint)}.opt.sel .l{background:var(--primary);color:#fff}
.qdots{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.qdots button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12.5px;color:var(--muted)}
.qdots button.a{background:var(--primary-tint);color:var(--primary-deep)}.qdots button.c{background:var(--primary);color:#fff;border-color:var(--primary)}
.comp-ico svg[class=""]{width:17px;height:17px}
/* turli */
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}.legend2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.minibar2{display:inline-block;width:90px;height:6px;border-radius:20px;background:var(--surface-2);overflow:hidden;vertical-align:middle;margin-right:6px}
.minibar2 i{display:block;height:100%;background:var(--primary)}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;margin:4px 0 14px;color:var(--ink)}
.chk input{width:16px;height:16px;accent-color:var(--primary)}
.drop{display:block;border:2px dashed var(--primary-tint2);border-radius:14px;padding:20px;text-align:center;background:var(--primary-tint);color:var(--muted);font-size:12.5px;cursor:pointer;transition:.15s}
.drop:hover,.drop.ov{border-color:var(--primary)}
.drop svg{width:30px;height:30px;color:var(--primary);display:block;margin:0 auto 6px}
.drop b{display:block;color:var(--primary-deep);font-size:14px;margin-bottom:2px}
.drop.ok{border-color:var(--ok);background:var(--ok-tint)}.drop.ok svg,.drop.ok b{color:var(--ok)}
.drop input{display:none}
.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f6efdc;border:1px solid #ecdcae;color:#6b5414;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px}
.demo-bar svg{width:16px;height:16px}.demo-bar .btn{margin-left:auto}
.mtable .mt-subj .badge{margin-left:6px}
.uzr{stroke:#fff}
.uzr:hover{stroke:#123f6e}
.uzt{background:#123f6e}
.hbar-lbl{text-align:left}
.cert{max-width:640px;margin:0 auto}
.nam-photo svg{width:42px;height:42px}
.role-card.admin .rc-ic{background:var(--primary-deep);color:#fff}
.n-badge{text-transform:lowercase}
.mtable .badge{white-space:nowrap}
@media(max-width:1200px){.mbox{grid-template-columns:auto 1fr}.mb-r{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:940px){.tdate{display:none}.pipeline{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:640px){.mbox{grid-template-columns:1fr}.mb-l{padding:18px}.role-grid{grid-template-columns:1fr!important}.hbar-lbl{width:110px!important}.reader{height:100%;border-radius:0}.overlay{padding:0!important}.rd-act .btn span{display:none}}

/* trend diagramma */
.trend{display:grid;grid-template-columns:38px 1fr;gap:6px;margin-top:32px}
.tr-axis{position:relative;height:200px;font-size:11px;color:var(--muted-2);font-weight:600}.tr-axis span{position:absolute;right:0;line-height:14px}
.tr-m .sh{display:none}
.tr-plot{position:relative}
.tr-grid{position:absolute;left:0;right:0;top:0;height:200px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.tr-grid i{display:block;height:1px;background:var(--line)}
.tr-grid i:last-child{background:#c3d2e4}
.tr-cols{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tr-col{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding-bottom:8px}
.tr-col.cur{background:linear-gradient(180deg,transparent 0,var(--primary-tint) 100%)}
.tr-bars{height:200px;display:flex;align-items:flex-end;gap:8px}
.tr-b{width:32px;border-radius:6px 6px 0 0;position:relative;transition:height .8s cubic-bezier(.2,.7,.2,1)}
.tr-b.r{background:var(--primary-tint2)}.tr-b.t{background:var(--primary)}
.tr-b span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;font-size:11.5px;font-weight:800;white-space:nowrap;color:var(--muted)}
.tr-b.t span{color:var(--primary-deep)}
.tr-b.t.nil span{display:none}
.tr-m{margin-top:10px;font-size:12.5px;font-weight:800;color:var(--ink)}
.tr-m em{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--primary);border-radius:20px;padding:1px 6px;margin-left:3px;vertical-align:1px}
.tr-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.tr-s b{color:var(--ok);font-weight:800}.tr-s i{color:var(--muted-2)}

.tst-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}

.urow{display:grid;grid-template-columns:24px 1fr 90px 44px;gap:10px;align-items:center;padding:7px 6px;border-radius:9px;cursor:pointer;font-size:13px}
.urow:hover{background:var(--surface-2)}
.urow .un{font-weight:800;color:var(--muted-2);font-size:12px}.urow .ut{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.choice{grid-template-columns:repeat(3,1fr)}

.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars .st svg{width:15px;height:15px;color:#d8dee8}.stars .st.on svg{color:#e0a817}
.stars.sm .st svg{width:12px;height:12px}
.bk-tr.rate{align-items:center}.bk-tr.rate svg{margin-top:0}
.rv-block{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.rv-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rv-sum{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}.rv-sum b{font-size:20px;color:var(--ink)}
.rv-form{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:14px}
.rv-l{font-size:12.5px;font-weight:700}
.rv-stars{display:flex;gap:4px}
.rv-stars button{border:0;background:none;padding:2px;cursor:pointer}
.rv-stars svg{width:26px;height:26px;color:#d8dee8;transition:.12s}.rv-stars .on svg{color:#e0a817}
.rv-stars button:hover svg{transform:scale(1.12)}
.rv-form textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:500 14px var(--font);resize:vertical;background:#fff}
.rv-list{display:grid;gap:10px}
.rv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.rv-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rv-card.best{border-color:#bfe3cc;background:linear-gradient(180deg,#f4fbf6,#fff)}
.rv-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rv-book{font-size:12.5px;font-weight:700;color:var(--primary-deep);margin-top:10px;display:flex;align-items:center;gap:6px}.rv-book svg{width:13px;height:13px}
.rv-text{font-size:13.5px;line-height:1.55;margin:10px 0}
.rv-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn.liked{background:#fdecef;border-color:#f5c3cd;color:#c0395a}
.interest-n svg{width:12px;height:12px;vertical-align:-1px;color:#c0395a}
/* hisobot */
.rp-paper{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 34px rgba(18,35,60,.12);padding:56px 56px 56px 96px;max-width:900px;width:100%;justify-self:center}
@media(max-width:700px){.rp-paper{padding:22px 16px}.rp-paper .rp-doc{font-size:12pt}.rv-grid{grid-template-columns:1fr}}

const MN=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
const MNC=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const curMonth=()=>today().slice(0,7);
const mShift=(m,k)=>{let [y,mm]=m.split('-').map(Number);mm+=k;while(mm<1){mm+=12;y--}while(mm>12){mm-=12;y++}return `${y}-${pad(mm)}`};
const mDays=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
const mLabel=m=>{const [y,mm]=m.split('-').map(Number);return `${MNC[mm-1]} ${y}`};
const dLabel=s=>{if(!s)return '—';const [y,m,d]=s.split('-').map(Number);return `${d}-${MN[m-1]}, ${y}`};
const dShort=s=>{if(!s)return '—';const [,m,d]=s.split('-').map(Number);return `${d}-${MN[m-1]}`};
const dAgo=s=>{const n=Math.round((new Date(today())-new Date(s))/864e5);return n<=0?'bugun':n===1?'kecha':n+' kun oldin'};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const initials=n=>String(n||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();

 const out=[];Object.keys(DB.months).sort().forEach(m=>{const mo=DB.months[m];if(!mo.demo)return;Object.keys(DB.results[m]||{}).forEach(sid=>{if(r()<.32){const res=DB.results[m][sid],b=book(mo.bookId);if(!b)return;const st=Math.max(3,Math.min(5,Math.round(3+res.pct/50+r()-.3)));out.push({id:'r'+out.length,bookId:b.id,staffId:sid,stars:st,text:T[Math.floor(r()*T.length)].replace('{t}',b.t),sana:res.date,likes:DB.staff.filter(()=>r()<.06).map(s=>s.id),best:false})}})});

function tr(s){return String(s||'').replace(/[ʻʼ‘’`´]/g,"'").replace(/[“”«»„]/g,'"').replace(/[—–]/g,'-').replace(/…/g,'...').replace(/[^\x20-\x7E]/g,'')}
function pdfEsc(s){return tr(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function wrapT(s,n){const w=tr(s).split(/\s+/);const L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>n){L.push(c.trim());c=x}else c+=' '+x});if(c.trim())L.push(c.trim());return L}
function makePdf(b){const W=595,H=842,ctr=(t,sz)=>Math.max(40,(W-tr(t).length*sz*.5)/2);
 let p1=`0.07 0.25 0.43 rg 0 0 ${W} ${H} re f 0.83 0.69 0.34 RG 2 w 40 40 ${W-80} ${H-80} re S BT /F2 13 Tf 0.95 0.9 0.76 rg ${ctr(b.a,13)} 700 Td (${pdfEsc(b.a.toUpperCase())}) Tj ET `;
 wrapT(b.t,30).forEach((l,i)=>{p1+=`BT /F2 30 Tf 1 1 1 rg ${ctr(l,30)} ${520-i*40} Td (${pdfEsc(l)}) Tj ET `});
 p1+=`BT /F1 11 Tf 0.75 0.82 0.9 rg ${ctr("O'ZBEKISTON RESPUBLIKASI ICHKI ISHLAR VAZIRLIGI",11)} 110 Td (O'ZBEKISTON RESPUBLIKASI ICHKI ISHLAR VAZIRLIGI) Tj ET BT /F1 11 Tf ${ctr('ELEKTRON KUTUBXONA',11)} 92 Td (ELEKTRON KUTUBXONA) Tj ET`;
 let y=760,p2=`BT /F2 18 Tf 0.07 0.25 0.43 rg 60 ${y} Td (${pdfEsc(b.t.slice(0,60))}) Tj ET `;y-=24;p2+=`BT /F1 12 Tf 0.35 0.4 0.5 rg 60 ${y} Td (${pdfEsc(b.a+(b.year?', '+b.year:''))}) Tj ET `;y-=46;
 p2+=`BT /F2 13 Tf 0.08 0.13 0.22 rg 60 ${y} Td (Annotatsiya) Tj ET `;y-=22;wrapT(b.ann,82).forEach(l=>{p2+=`BT /F1 12 Tf 0.08 0.13 0.22 rg 60 ${y} Td (${pdfEsc(l)}) Tj ET `;y-=18});y-=30;
 p2+=`0.95 0.96 0.98 rg 50 ${y-62} ${W-100} 78 re f BT /F2 11 Tf 0.12 0.37 0.62 rg 64 ${y} Td (NAMUNA PDF) Tj ET `;y-=20;
 wrapT("Bu fayl platformani sinash uchun avtomatik yaratilgan namuna. Kitobning haqiqiy elektron nusxasi administrator tomonidan 'Kitoblar fondi' bo'limida yuklanadi.",80).forEach(l=>{p2+=`BT /F1 11 Tf 0.3 0.35 0.45 rg 64 ${y} Td (${pdfEsc(l)}) Tj ET `;y-=16});
 const objs=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R 4 0 R]/Count 2>>',`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 5 0 R/F2 6 0 R>>>>/Contents 7 0 R>>`,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 5 0 R/F2 6 0 R>>>>/Contents 8 0 R>>`,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>','<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>',`<</Length ${p1.length}>>\nstream\n${p1}\nendstream`,`<</Length ${p2.length}>>\nstream\n${p2}\nendstream`];
 let out='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});const xr=out.length;
 out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
 return new Blob([out],{type:'application/pdf'})}

const MEM={};let idb=null;
function idbOpen(){return new Promise(res=>{if(idb)return res(idb);try{const q=indexedDB.open('iiv_elib_pdf',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>{idb=q.result;res(idb)};q.onerror=()=>res(null)}catch(e){res(null)}})}
async function putFile(id,blob){MEM[id]=blob;const d=await idbOpen();if(!d)return;try{d.transaction('f','readwrite').objectStore('f').put(blob,id)}catch(e){}}
async function getFile0(id){if(MEM[id])return MEM[id];const d=await idbOpen();if(!d)return null;return new Promise(res=>{try{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>{if(q.result)MEM[id]=q.result;res(q.result||null)};q.onerror=()=>res(null)}catch(e){res(null)}})}
async function getFile(id){let f=await getFile0(id);if(!f){const b=book(id);if(b&&b.demo){f=makePdf(b);await putFile(id,f)}}return f}
async function delFile(id){delete MEM[id];const d=await idbOpen();if(!d)return;try{d.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}}
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

 Object.keys(DB.months).forEach(m=>{const mo=DB.months[m],b=book(mo.bookId);const p=(DB.progress[m]||{})[sid],r=(DB.results[m]||{})[sid];
  if(p&&b){parts.read+=Math.min(20,Math.round(p.page/b.pages*20));if(p.page>=b.pages)parts.fin+=10}

 parts.ev=DB.elon.filter(e=>(e.reg||[]).includes(sid)).length*5;parts.req=DB.sorov.filter(q=>q.staffId===sid&&q.holat==='done'&&(q.tur||'kitob')==='kitob').length*5;

 const sc=ss.filter(s=>rs[s.id]).map(s=>rs[s.id].pct);return {N:ss.length,reading,finished,tested,passed,avg:sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0,cov:ss.length?Math.round(reading/ss.length*100):0,b,mo}}

function plDec(s){let i=0,x=0,y=0,o=[];while(i<s.length){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);x+=(r&1)?~(r>>1):(r>>1);r=0;sh=0;do{b=s.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);y+=(r&1)?~(r>>1):(r>>1);o.push(x,y)}return o}
function plPath(enc){return enc.split(';').map(rg=>{const p=plDec(rg);if(p.length<6)return '';let d='M'+p[0]+','+p[1];for(let i=2;i<p.length;i+=2)d+='L'+p[i]+','+p[i+1];return d+'Z'}).join(' ')}

function mkLogin(n){const p=n.toLowerCase().replace(/[ʻʼ'‘’`]/g,'').replace(/sh/g,'sh').split(/\s+/);let base=(p[0]||'xodim').replace(/[^a-z]/g,'')+(p[1]?'.'+p[1][0].replace(/[^a-z]/g,''):'');let l=base,i=2;while(DB.staff.some(s=>s.login===l))l=base+i++;return l}

function aUsers(){const C=isCentral();return `<div class="stats">${statCard('users','c-kurs',DB.staff.filter(s=>!scopeU()||s.unit===scopeU()).length,'Roʻyxatdagi xodimlar',C?'barcha boʻlinmalar':esc(unit(ME.unit).s),'var(--primary)')}${statCard('open','c-obod',DB.staff.filter(s=>(!scopeU()||s.unit===scopeU())&&(DB.progress[curMonth()]||{})[s.id]).length,'Shu oy faol','oy kitobini oʻqimoqda','var(--ok)')}${statCard('userShield','c-kredit',DB.staff.filter(s=>(!scopeU()||s.unit===scopeU())&&!(DB.progress[curMonth()]||{})[s.id]).length,'Faol emas','eslatma yuborish tavsiya etiladi','var(--slate)')}${statCard('shield','c-ish',C?UNITS.length:1,'Admin panel',C?'hudud + Akademiya + markaz':'boʻlinma admini','var(--slate)')}</div>
 <div class="sec-head"><div><div class="sec-title">Xodimlar roʻyxati</div><div class="sub">Har bir xodimga login va parol beriladi — xodim shu bilan tizimga kiradi</div></div><button class="btn btn-primary btn-sm" onclick="userModal()">${I('plus')} Xodim qoʻshish</button></div>
 <div class="mtoolbar"><div class="mah-search">${I('search')}<input placeholder="F.I.Sh yoki login…" value="${esc(auQ)}" oninput="auQ=this.value;renderUsers()"></div>${C?`<div class="msel"><select onchange="auUnit=this.value;renderUsers()"><option value="">Barcha boʻlinmalar</option>${UNITS.map(u=>`<option value="${u.id}"${auUnit===u.id?' selected':''}>${esc(u.n)}</option>`).join('')}</select></div>`:''}<button class="btn btn-ghost btn-sm" onclick="exportUsers()">${I('csv')} Login-parollar (CSV)</button></div><div id="aulist"></div>`}
function renderUsers(){const q=auQ.toLowerCase(),U=scopeU()||auUnit,l=DB.staff.filter(s=>(!U||s.unit===U)&&(!q||(s.n+' '+(s.login||'')).toLowerCase().includes(q)));
 $('#aulist').innerHTML=`<div style="font-size:13px;color:var(--muted);margin-bottom:10px">${l.length} nafar xodim</div><div class="mtable-wrap"><table class="mtable"><thead><tr><th>Xodim</th><th>Boʻlinma</th><th>Login</th><th>Parol</th><th>Qoʻshilgan</th><th></th></tr></thead><tbody>${l.map(s=>`<tr style="cursor:default"><td><div class="avat"><span class="ac">${initials(s.n)}</span><div><div class="an">${esc(s.n)}</div><div class="mt-by">${esc(s.rank||'')}</div></div></div></td><td>${esc(unit(s.unit).s)}</td><td><code class="lg">${esc(s.login||'—')}</code></td><td><code class="lg">${showPw[s.id]?esc(s.pass):'••••••'}</code> <button class="btn btn-ghost btn-xs" onclick="showPw['${s.id}']=!showPw['${s.id}'];renderUsers()">${I('eye')}</button></td><td>${s.added?dShort(s.added):'—'}</td><td><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn btn-ghost btn-xs" title="Tahrirlash" onclick="userModal('${s.id}')">${I('edit')}</button><button class="btn btn-ghost btn-xs" title="Yangi parol" onclick="resetPw('${s.id}')">${I('refresh')}</button><button class="btn btn-ghost btn-xs" style="color:var(--alert)" title="Oʻchirish" onclick="delUser('${s.id}')">${I('trash')}</button></div></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Xodim yoʻq</div></td></tr>'}</tbody></table></div>`}
function userModal(id){const s=id?staffById(id):null,C=isCentral(),u=s?s.unit:(scopeU()||auUnit||'markaz');
 openModal(modalHead(s?'Xodimni tahrirlash':'Yangi xodim',C?'Istalgan boʻlinmaga':esc(unit(ME.unit).n))+`<div class="modal-body"><div class="field"><label>Familiya, ism, otasining ismi *</label><input id="u-n" value="${esc(s?s.n:'')}" oninput="if(!${!!s}){const l=document.getElementById('u-l');if(!l.dataset.t)l.value=mkLogin(this.value)}"></div>
 <div class="row2"><div class="field"><label>Unvon</label><select id="u-r">${['oddiy askar','serjant','leytenant','katta leytenant','kapitan','mayor','podpolkovnik','polkovnik','fuqaro xodim'].map(x=>`<option${s&&s.rank===x?' selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Boʻlinma</label><select id="u-u"${C?'':' disabled'}>${UNITS.map(x=>`<option value="${x.id}"${x.id===u?' selected':''}>${esc(x.n)}</option>`).join('')}</select></div></div>
 <div class="row2"><div class="field"><label>Login *</label><input id="u-l" value="${esc(s?s.login:'')}" oninput="this.dataset.t=1"></div><div class="field"><label>Parol *</label><div style="display:flex;gap:6px"><input id="u-p" value="${esc(s?s.pass:mkPass())}"><button class="btn btn-ghost btn-sm" onclick="document.getElementById('u-p').value=mkPass()" title="Yangi parol">${I('refresh')}</button></div></div></div>
 <div class="info-note" style="margin-bottom:14px">${I('info')}<span>Login va parolni xodimga shaxsan yetkazing. Haqiqiy tizimda parol shifrlangan holda saqlanadi va xodim birinchi kirishda uni almashtiradi.</span></div>
 <button class="btn btn-primary btn-lg" style="width:100%" onclick="userSave(${s?`'${s.id}'`:''})">${I('ok')} ${s?'Saqlash':'Xodimni qoʻshish'}</button></div>`,'wide')}
function userSave(id){const n=$('#u-n').value.trim(),l=$('#u-l').value.trim().toLowerCase(),p=$('#u-p').value.trim(),u=isCentral()?$('#u-u').value:ME.unit;
 if(n.split(/\s+/).length<2){toast('Familiya va ismni toʻliq kiriting');return}if(!/^[a-z0-9._-]{3,}$/.test(l)){toast('Login kamida 3 ta lotin harf/raqamdan iborat boʻlsin');return}if(p.length<4){toast('Parol kamida 4 belgi');return}
 if(DB.staff.some(s=>s.login===l&&s.id!==id)){toast('Bu login band');return}
 if(id){const s=staffById(id);Object.assign(s,{n,rank:$('#u-r').value,unit:u,login:l,pass:p})}else DB.staff.push({id:'s'+uid(),n,rank:$('#u-r').value,unit:u,login:l,pass:p,added:today()});
 save();closeModal();render();toast(id?'Saqlandi':`Xodim qoʻshildi · login: ${l}`)}
function resetPw(id){const s=staffById(id);if(!confirm(`${s.n} uchun yangi parol yaratilsinmi?`))return;s.pass=mkPass();showPw[id]=true;save();renderUsers();toast('Yangi parol: '+s.pass)}
function delUser(id){const s=staffById(id);if(!confirm(`${s.n} roʻyxatdan oʻchirilsinmi?`))return;DB.staff=DB.staff.filter(x=>x.id!==id);Object.values(DB.progress).forEach(p=>delete p[id]);save();render();toast('Xodim oʻchirildi')}
function exportUsers(){const U=scopeU()||auUnit;csvDl('IIV_xodimlar_login_'+(U||'barcha')+'.csv',[['F.I.Sh','Unvon','Boʻlinma','Login','Parol'],...DB.staff.filter(s=>!U||s.unit===U).map(s=>[s.n,s.rank,unit(s.unit).n,s.login,s.pass])])}
function aAdmins(){return `<div class="card pad"><div class="sec-title">Admin panellar</div><div style="font-size:13px;color:var(--muted);margin-bottom:12px">Har bir hudud va IIV Akademiyasi oʻz admin paneliga ega: xodimlarni kiritadi, kitob yuklaydi va faqat oʻz statistikasini koʻradi. Oy kitobi va umumiy statistika — faqat markaziy apparatda.</div><div class="mtable-wrap"><table class="mtable"><thead><tr><th>Tashkilot</th><th>Admin login</th><th>Parol</th><th>Xodimlar</th><th>Yuklagan kitoblari</th><th>Qamrov</th><th></th></tr></thead><tbody>${UNITS.map(u=>{const a=DB.admins[u.id]||{},A=monthAgg(curMonth(),u.id);return `<tr style="cursor:default"><td><div class="mt-subj">${esc(u.n)}</div><div class="mt-by">${u.id==='markaz'?'Bosh admin — toʻliq huquq':'Hudud admini'}</div></td><td><code class="lg">${esc(a.login||'—')}</code></td><td><code class="lg">${showPw['a_'+u.id]?esc(a.pass):'••••••'}</code> <button class="btn btn-ghost btn-xs" onclick="showPw['a_${u.id}']=!showPw['a_${u.id}'];render()">${I('eye')}</button></td><td>${A.N}</td><td>${DB.books.filter(b=>b.owner===u.id).length}</td><td><span class="minibar2"><i style="width:${A.cov}%"></i></span> <b>${A.cov}%</b></td><td><button class="btn btn-ghost btn-xs" onclick="adminPw('${u.id}')">${I('refresh')} Parol</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function adminPw(uid0){const a=DB.admins[uid0];if(!confirm(`${unit(uid0).n} admini uchun yangi parol yaratilsinmi?`))return;a.pass=mkPass();showPw['a_'+uid0]=true;save();render();toast('Yangi parol: '+a.pass)}

function canEditBook(b){return isCentral()||b.owner===ME.unit}
let abOwn='';
function aBooks(){const b=editId?book(editId):null,o=(arr,v)=>arr.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');if(b&&!canEditBook(b)){editId=null;return aBooks()}
 return `<div class="cols" style="grid-template-columns:1.25fr 1fr"><div class="card pad" id="bform"><div class="sec-title">${b?'Kitobni tahrirlash':'Fondga yangi kitob qoʻshish'}</div><div style="font-size:13px;color:var(--muted);margin-bottom:16px">${b?'Yangi PDF tanlanmasa, mavjud fayl saqlanib qoladi':`Kitob umumiy elektron fondga «${esc(unit(ME.unit).s)}» nomidan qoʻshiladi va barcha xodimlarga koʻrinadi`}</div>
 <label class="drop${b?' ok':''}" id="drop" ondragover="event.preventDefault();this.classList.add('ov')" ondragleave="this.classList.remove('ov')" ondrop="event.preventDefault();this.classList.remove('ov');pickPdf(event.dataTransfer.files[0])">${I('up')}<b id="dropt">${b?esc(b.pdfSize==='namuna'?'namuna PDF':b.pdfName+' · '+b.pdfSize):'Kitobning PDF faylini shu yerga tashlang yoki tanlang *'}</b><span>Faqat .pdf · 200 MB gacha</span><input type="file" accept="application/pdf,.pdf" onchange="pickPdf(this.files[0])"></label>
 <div class="field" style="margin-top:14px"><label>Kitob nomi *</label><input id="f-t" value="${esc(b?b.t:'')}"></div><div class="row2"><div class="field"><label>Muallif *</label><input id="f-a" value="${esc(b?b.a:'')}"></div><div class="field"><label>Turkum *</label><select id="f-cat">${CATS.map(c=>`<option value="${c.k}"${b&&b.cat===c.k?' selected':''}>${c.n}</option>`).join('')}</select></div></div>
 <div class="row2" style="grid-template-columns:1fr 1fr 1fr"><div class="field"><label>Nashr yili</label><input id="f-y" value="${esc(b?b.year:'')}"></div><div class="field"><label>Sahifalar *</label><input id="f-p" type="number" min="1" value="${b?b.pages:''}"></div><div class="field"><label>Til</label><select id="f-l">${o(['Oʻzbek (lotin)','Oʻzbek (kirill)','Rus','Ingliz','Qoraqalpoq'],b?b.lang:'')}</select></div></div>
 <div class="field"><label>Annotatsiya</label><textarea id="f-n" rows="3">${esc(b?b.ann:'')}</textarea></div><div class="field"><label>Muqova rasmi (ixtiyoriy)</label><input id="f-c" type="file" accept="image/*"></div>
 ${b?'':`<label class="chk"><input type="checkbox" id="f-e" checked> “Yangi kitob” eʼlonini avtomatik joylash</label>`}
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px"><button class="btn btn-primary" onclick="saveBook()">${I('ok')} ${b?'Saqlash':'Fondga qoʻshish'}</button>${b?`<button class="btn btn-ghost" onclick="editId=null;pdfPick=null;render()">Bekor qilish</button>`:''}</div></div>
 <div class="card pad"><div class="sec-title">Fond tarkibi</div><div style="margin-top:12px">${CATS.map(c=>`<div class="comp-item"><div class="comp-ico">${I(c.ic)}</div><div style="flex:1;font-weight:600;font-size:13.5px">${esc(c.n)}</div><b>${DB.books.filter(x=>x.cat===c.k).length}</b></div>`).join('')}</div><div class="info-note" style="margin-top:14px">${I('info')}<span>Fondga faqat rasmiy nashrlar yoki muallif/nashriyot roziligi olingan kitoblar joylanadi. Grifli (“Maxfiy”, “XFU”) materiallar bu platformaga yuklanmaydi.${isCentral()?'':' Siz faqat oʻzingiz yuklagan kitoblarni tahrirlay olasiz.'}</span></div></div></div>
 <div class="sec-head"><div><div class="sec-title">Fonddagi kitoblar</div></div><button class="btn btn-ghost btn-sm" onclick="exportBooks()">${I('csv')} CSV</button></div><div class="mtoolbar"><div class="mah-search">${I('search')}<input placeholder="Qidirish…" value="${esc(abQ)}" oninput="abQ=this.value;renderABooks()"></div><div class="msel"><select onchange="abCat=this.value;renderABooks()"><option value="">Barcha turkumlar</option>${CATS.map(c=>`<option value="${c.k}"${abCat===c.k?' selected':''}>${c.n}</option>`).join('')}</select></div><div class="msel"><select onchange="abOwn=this.value;renderABooks()"><option value="">Barcha manbalar</option>${isCentral()?UNITS.map(u=>`<option value="${u.id}"${abOwn===u.id?' selected':''}>${esc(u.s)}</option>`).join(''):`<option value="${ME.unit}"${abOwn===ME.unit?' selected':''}>Faqat biz yuklaganlar</option>`}</select></div></div><div id="ablist"></div>`}
function renderABooks(){const q=abQ.toLowerCase(),l=DB.books.filter(b=>(!abCat||b.cat===abCat)&&(!abOwn||b.owner===abOwn)&&(!q||(b.t+' '+b.a).toLowerCase().includes(q))),mb=M()&&M().bookId;
 $('#ablist').innerHTML=`<div class="mtable-wrap"><table class="mtable"><thead><tr><th>Kitob</th><th>Turkum</th><th>Manba</th><th>Bet</th><th>PDF</th><th>Oʻqish</th><th></th></tr></thead><tbody>${l.map(b=>{const ce=canEditBook(b);return `<tr style="cursor:default"><td><div style="display:flex;align-items:center;gap:12px">${miniCover(b,34,48)}<div><div class="mt-subj">${esc(b.t)} ${b.id===mb?'<span class="badge c-obod">Oy kitobi</span>':''}</div><div class="mt-by">${esc(b.a)}${b.year?' · '+esc(b.year):''}</div></div></div></td><td><span class="badge grey">${esc(cat(b.cat).n)}</span></td><td><span class="badge ${b.owner===ME.unit?'teal':'grey'}">${esc(unit(b.owner||'markaz').s)}</span></td><td>${b.pages}</td><td><div style="display:flex;gap:6px;align-items:center"><span class="badge ${b.pdfSize==='namuna'?'slate':'ok'}">${b.pdfSize==='namuna'?'namuna PDF':esc(b.pdfSize)}</span>${ce?`<label class="btn btn-ghost btn-xs" title="PDFni almashtirish">${I('up')}<input type="file" accept="application/pdf,.pdf" hidden onchange="attachPdf('${b.id}',this.files[0])"></label>`:''}</div></td><td>${fmt(b.views)}</td><td><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn btn-ghost btn-xs" onclick="openBook('${b.id}')">${I('eye')}</button>${ce?`<button class="btn btn-ghost btn-xs" onclick="editId='${b.id}';pdfPick=null;render()">${I('edit')}</button><button class="btn btn-ghost btn-xs" style="color:var(--alert)" onclick="delBook('${b.id}')">${I('trash')}</button>`:''}</div></td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">Kitob topilmadi</div></td></tr>'}</tbody></table></div>`}
async function saveBook(){const v=id=>$('#'+id).value.trim(),t=v('f-t'),a=v('f-a'),p=parseInt(v('f-p'),10);if(!editId&&!pdfPick){toast('Kitobning PDF faylini yuklang — fondga faqat PDF kitoblar qoʻshiladi');$('#drop').classList.add('ov');return}if(!t||!a||!p){toast('Nomi, muallif va sahifalar sonini kiriting');return}
 const cv=await readImg($('#f-c').files[0]);let b=editId?book(editId):null;const isNew=!b;if(isNew)b={id:'b'+uid(),added:today(),views:0,dl:0,hasPdf:true,owner:ME.unit};else if(!canEditBook(b)){toast('Bu kitobni tahrirlash huquqi yoʻq');return}
 Object.assign(b,{t,a,cat:v('f-cat'),year:v('f-y'),pages:p,lang:v('f-l'),ann:v('f-n')});if(cv)b.cover=cv;if(pdfPick){await putFile(b.id,pdfPick);b.pdfName=pdfPick.name;b.pdfSize=fsize(pdfPick.size);delete b.demo}
 if(isNew){DB.books.unshift(b);if($('#f-e')&&$('#f-e').checked)DB.elon.unshift({id:'e'+uid(),tur:'yangi',sarlavha:`Fondga yangi kitob: «${t}»`,matn:`${a} qalamiga mansub «${t}» kitobi elektron kutubxonaga PDF shaklida joylandi. Katalogning “${cat(b.cat).n}” boʻlimida.`,muddat:'',joy:'',unit:'all',sana:today(),muallif:isCentral()?'Kutubxona fondi':unit(ME.unit).n,reg:[]})}
 save();toast(isNew?`«${t}» fondga qoʻshildi`:'Oʻzgarishlar saqlandi');pdfPick=null;editId=null;render()}
async function attachPdf(id,f){if(!f)return;const b=book(id);if(!canEditBook(b))return;if(!/\.pdf$/i.test(f.name)||!(await isPdf(f))){toast('Faqat PDF formatdagi fayl qabul qilinadi');return}await putFile(id,f);b.pdfName=f.name;b.pdfSize=fsize(f.size);delete b.demo;save();renderABooks();toast('PDF yangilandi: '+b.t)}
function delBook(id){const b=book(id);if(!canEditBook(b))return;if(Object.values(DB.months).some(m=>m.bookId===id)){toast('Bu kitob oy kitobi sifatida belgilangan — oʻchirib boʻlmaydi');return}if(!confirm(`«${b.t}» fonddan oʻchirilsinmi?`))return;DB.books=DB.books.filter(x=>x.id!==id);delFile(id);save();renderABooks();toast('Kitob oʻchirildi')}
function exportBooks(){csvDl('IIV_kutubxona_fondi_'+today()+'.csv',[['№','Nomi','Muallif','Turkum','Manba','Yil','Bet','Til','Oʻqishlar','Yuklab olishlar','Qoʻshilgan'],...DB.books.map((b,i)=>[i+1,b.t,b.a,cat(b.cat).n,unit(b.owner||'markaz').n,b.year,b.pages,b.lang,b.views||0,b.dl||0,b.added])])}

function elonCard(e,adm){const t=ELON_TUR[e.tur],reg=(e.reg||[]);const mine=ME.role==='xodim'&&reg.includes(ME.id);const canDel=adm&&(isCentral()||e.unit===ME.unit);
 const foot=t.reg?(ME.role==='xodim'?(mine?`<span class="badge ok">${I('ok')} Roʻyxatdan oʻtdingiz</span>`:`<div style="display:flex;align-items:center;gap:12px"><span class="interest-n">${reg.length} kishi roʻyxatdan oʻtdi</span><button class="btn btn-primary btn-sm" onclick="elonReg('${e.id}')">${I('hand')} Qatnashaman</button></div>`):`<span class="interest-n">${reg.length} kishi roʻyxatdan oʻtdi</span>`):'';
 return `<div class="card elon-card">${canDel?`<button class="elon-del" title="Oʻchirish" onclick="elonDel('${e.id}')">${I('trash')}</button>`:''}<div class="elon-top"><span class="badge ${t.c}">${I(t.ic)} ${t.n}</span>${e.unit!=='all'?`<span class="badge grey">${I('map')} ${esc(unit(e.unit).s)}</span>`:`<span class="badge grey">Barcha boʻlinmalar</span>`}</div><div class="elon-title">${esc(e.sarlavha)}</div><div class="elon-txt">${esc(e.matn)}</div>${e.muddat||e.joy?`<div class="elon-meta">${e.muddat?`<span>${I('clock')}${esc(e.muddat)}</span>`:''}${e.joy?`<span>${I('pin')}${esc(e.joy)}</span>`:''}</div>`:''}<div class="elon-foot"><div class="elon-author"><span class="av">${initials(e.muallif)}</span>${esc(e.muallif)} · ${dLabel(e.sana)}</div>${foot}</div></div>`}
function aElon(){const U=scopeU(),src=DB.elon.filter(e=>!U||e.unit===U||e.unit==='all'),l=src.filter(e=>elonF==='all'||e.tur===elonF).sort((a,b)=>b.sana.localeCompare(a.sana)),regTot=src.reduce((s,e)=>s+(e.reg||[]).length,0);const mx=Math.max(1,...Object.keys(ELON_TUR).map(k=>src.filter(e=>e.tur===k).length));
 return `<div class="stats">${statCard('bullhorn','c-kurs',src.length,U?'Xodimlarimizga koʻrinadigan eʼlonlar':'Jami eʼlonlar')}${statCard('users','c-obod',regTot,'Tadbirlarga roʻyxatdan oʻtganlar')}${statCard('map','c-kredit',U?DB.elon.filter(e=>e.unit===U).length:new Set(DB.elon.filter(e=>e.unit!=='all').map(e=>e.unit)).size,U?'Biz joylagan eʼlonlar':'Hudud eʼlonlari bor boʻlinmalar')}${statCard('cal','c-ish',src.filter(e=>e.sana.slice(0,7)===curMonth()).length,'Shu oy joylangan')}</div>

const MCYR=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function cyr(s){s=String(s||'');const M0={a:'а',b:'б',d:'д',e:'е',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',c:'ц',w:'в'};const AP=/[ʻʼ'‘’`]/;let o='';
 for(let i=0;i<s.length;i++){const ch=s[i],lo=ch.toLowerCase(),up=ch!==lo,nx=(s[i+1]||'').toLowerCase(),prev=s[i-1]||'';const U=(x)=>up?x.toUpperCase():x;
  if((lo==='o'||lo==='g')&&AP.test(s[i+1]||'')){o+=U(lo==='o'?'ў':'ғ');i++;continue}
  if(lo==='s'&&nx==='h'){o+=U('ш');i++;continue}if(lo==='c'&&nx==='h'){o+=U('ч');i++;continue}
  if(lo==='y'&&'oaue'.includes(nx)&&nx){o+=U({o:'ё',a:'я',u:'ю',e:'е'}[nx]);i++;continue}
  if(lo==='e'){o+=U(/[A-Za-zʻʼ'‘’`]/.test(prev)?'е':'э');continue}
  if(AP.test(ch)){o+=/[A-Za-z]/.test(prev)?'ъ':ch;continue}
  o+=M0[lo]?U(M0[lo]):ch}
 return o}

function wordify(b){const F='font-family:\'Times New Roman\';',B='border:1pt solid #000;padding:3pt 5pt;vertical-align:top;';

 .replace(/<p class="rp-date">/g,`<p style="${F}font-size:12pt;margin:12pt 0 0;text-indent:0;text-align:left">`)
 .replace(/<p>/g,`<p style="${F}font-size:14pt;margin:0 0 6pt;text-indent:35.4pt;text-align:justify">`)
 .replace(/<h1>/g,`<h1 style="${F}font-size:14pt;font-weight:bold;text-align:center;margin:12pt 0 14pt">`)
 .replace(/<h2>/g,`<h2 style="${F}font-size:14pt;font-weight:bold;text-align:left;margin:14pt 0 6pt">`)
 .replace(/<table>/g,`<table border="1" cellspacing="0" cellpadding="4" width="100%" style="width:100%;border-collapse:collapse;margin:6pt 0 10pt">`)
 .replace(/<th>№<\/th>/g,`<th width="40" style="${F}${B}width:30pt;font-size:11pt;font-weight:bold;text-align:center;background:#f2f2f2">№</th>`)
 .replace(/<th>/g,`<th style="${F}${B}font-size:11pt;font-weight:bold;text-align:center;background:#f2f2f2;white-space:nowrap" nowrap>`)
 .replace(/<td class="n">/g,`<td style="${F}${B}font-size:12pt;text-align:center;white-space:nowrap" nowrap>`)
 .replace(/<td>/g,`<td style="${F}${B}font-size:12pt;text-align:left">`)
 .replace('<div class="rp-sign"><div>',`<table border="0" width="100%" style="width:100%;border:none;margin-top:30pt"><tr><td style="${F}font-size:14pt;border:none;font-weight:bold">`)
 .replace('</div><div>____________</div></div>',`</td><td style="${F}font-size:14pt;border:none;text-align:right;font-weight:bold;vertical-align:bottom">____________</td></tr></table>`)}
function repWord(){const {body,name}=repFile();const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Hisobot</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>@page WordSection1{size:595.3pt 841.9pt;margin:56.7pt 42.5pt 56.7pt 85.05pt}div.WordSection1{page:WordSection1}${REP_CSS.replace('@page{size:A4;margin:20mm 15mm 20mm 30mm}','')} .rp-doc .rp-sign{display:block}</style></head><body><div class="WordSection1">${wordify(body)}</div></body></html>`;
 const blob=new Blob(['﻿'+html],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.doc';document.body.appendChild(a);a.click();a.remove();toast('Word fayl yuklab olindi')}
